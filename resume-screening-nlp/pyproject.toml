[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-screening-nlp"
version = "1.0.0"
description = "Resume and job-description matching with sentence embeddings"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
resume-screen = "resume_screening.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
